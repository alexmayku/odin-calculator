<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Odin Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="calculator">
    <div class="display" id="display">
    </div>
    <div class="buttons">
        <div class="row">
        <button class="number btn-1">1</button>
        <button class="number btn-2">2</button>
        <button class="number btn-3">3</button>
        <button class="operator btn-plus">+</button>
        </div>
        <div class="row">
        <button class="number btn-4">4</button>
        <button class="number btn-5">5</button>
        <button class="number btn-6">6</button>
        <button class="operator btn-minus">-</button>
        </div>
        <div class="row">
        <button class="number btn-7">7</button>
        <button class="number btn-8">8</button>
        <button class="number btn-9">9</button>
        <button class="operator btn-times">x</button>
        </div>
        <div class="row">
        <button class="equals btn-equals">=</button>
        <button class="number btn-0">0</button>
        <button class="divide btn-divide">/</button>
        </div>
        <div class="row">
        <button class="clear btn-clear bottom-right bottom-left">clear</button>
        </div>
    </div>

</div>
    <script src="scripts.js"></script>
</body>
</html>
